<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilal Marth — Animated Logo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f7f2;font:15px/1.6 Arial,sans-serif;color:#203c2a}main{text-align:center;padding:35px 20px}.stage{display:grid;place-items:center;width:min(75vw,440px);min-height:440px;margin:auto}img{display:block;width:100%;height:auto;max-height:65svh;object-fit:contain;animation:arrive 1.2s ease-out both,float 6s 1.2s ease-in-out infinite;transform-origin:center}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}button,a{font:inherit;color:#203c2a;background:#fff;border:1px solid #b9c9b4;padding:9px 17px;border-radius:7px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #38624b;outline-offset:4px}.paused img{animation-play-state:paused}@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-1deg)}}@media(prefers-reduced-motion:reduce){img{animation:none}button{display:none}}@media(max-width:480px){.stage{min-height:320px}}
</style>
</head><body><main><div class="stage"><img src="bilal-marth-logo-hd.png" alt="Bilal Marth 7 — Traditional Stuff"></div><nav><button type="button" aria-pressed="false">Pause animation</button><a href="bilal-marth-logo-hd.png" download>Download transparent PNG</a><a href="../index.html">View portfolio</a></nav></main><script>const button=document.querySelector('button');button.addEventListener('click',()=>{const paused=document.body.classList.toggle('paused');button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'Play animation':'Pause animation'});</script></body></html>
